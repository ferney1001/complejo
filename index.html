<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alojamientos</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>

<header>
    <nav>
        <div class="logo">Complejo turístico</div>
        <div class="nav-links">
            <a href="/">Inicio</a>
            <a href="cancelar_reserva.html">Cancelar reserva</a>
        </div>
    </nav>
</header>

<main>
    <h1>Buscar Alojamientos</h1>
    <div class="search-form">
        <input type="date" id="fecha-llegada" placeholder="Fecha de llegada" required>
        <input type="date" id="fecha-salida" placeholder="Fecha de salida" required>
        <select id="tipo-alojamiento" required>
            <option value="">Selecciona tipo de alojamiento</option>
            <option value="habitacion">Habitaciones</option>
            <option value="cabana">Cabañas</option>
        </select>
        <button id="buscar-btn">Buscar</button>
    </div>

    <div id="alojamientos-container" class="container">
        <!-- Aquí se generarán las tarjetas de alojamientos -->
    </div>
</main>

<script>
    // Establecer la fecha mínima en los campos de fecha
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('fecha-llegada').setAttribute('min', today);
    document.getElementById('fecha-salida').setAttribute('min', today);
</script>

</body>
</html>
